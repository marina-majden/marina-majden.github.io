    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <style>
      .startup-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #021f33;
      }

      .startup-loader__spinner {
        box-sizing: border-box;
        width: 12rem;
        height: 12rem;
        padding: 0.75rem;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(to bottom left, #f472b6, #c084fc, #4f46e5);
        filter: drop-shadow(0 25px 25px rgb(0 0 0 / 0.25));
        animation: startup-spin 1.2s linear infinite;
      }

      .startup-loader__center {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #021f33;
        backdrop-filter: blur(12px);
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
