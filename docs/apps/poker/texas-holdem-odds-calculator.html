<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Hold'em Kalkulator Šansi (9 Igrača)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            user-select: none;
        }
        .card:hover:not(.disabled) { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        .card.disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }
        
        .suit-hearts, .suit-diams { color: #ef4444; } /* Crvena za srce i karo */
        .suit-spades, .suit-clubs { color: #1e293b; } /* Tamna za pik i tref */
        
        .slot {
            border: 2px dashed #334155;
            background-color: #1e293b;
            display: flex; justify-content: center; align-items: center;
            border-radius: 0.5rem;
            min-height: 120px;
        }
        
        /* Loading spinner */
        .loader {
            border: 4px solid #334155; border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col lg:flex-row">
        
        <!-- Lijeva strana: Odabrane karte i Rezultati -->
        <div class="w-full lg:w-1/2 p-6 md:p-10 border-b lg:border-b-0 lg:border-r border-slate-700">
            <h1 class="text-3xl font-bold mb-2 text-blue-400">Hold'em Kalkulator</h1>
            <p class="text-slate-400 text-sm mb-8">Izračunaj šanse protiv 8 nasumičnih protivnika (Turnir 9 max).</p>

            <!-- Tvoje karte (Hero) -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-3">
                    <h2 class="text-xl font-semibold">Tvoje karte (Hole)</h2>
                    <span class="text-xs font-medium px-2 py-1 bg-blue-900 text-blue-200 rounded">Odaberi točno 2</span>
                </div>
                <div class="grid grid-cols-2 gap-4 max-w-[250px]" id="hero-slots">
                    <!-- Slutovi će biti popunjeni JavaScriptom -->
                </div>
            </div>

            <!-- Karte na stolu (Board) -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-3">
                    <h2 class="text-xl font-semibold">Stol (Community)</h2>
                    <span class="text-xs font-medium px-2 py-1 bg-slate-700 text-slate-300 rounded">Odaberi 0, 3, 4 ili 5</span>
                </div>
                <div class="grid grid-cols-5 gap-2" id="board-slots">
                    <!-- Slutovi će biti popunjeni JavaScriptom -->
                </div>
            </div>

            <!-- Kontrole i Rezultati -->
            <div class="bg-slate-900 p-6 rounded-xl">
                <div class="flex gap-4 mb-6">
                    <button id="calc-btn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center gap-2" onclick="calculateOdds()">
                        <span id="calc-text">Izračunaj Šanse</span>
                        <div id="calc-loader" class="loader hidden"></div>
                    </button>
                    <button class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-lg transition" onclick="resetApp()">Resetiraj</button>
                </div>

                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-emerald-900/50 p-4 rounded-lg border border-emerald-800">
                        <div class="text-sm text-emerald-400 mb-1">Pobjeda</div>
                        <div class="text-2xl font-bold text-emerald-500" id="res-win">- %</div>
                    </div>
                    <div class="bg-amber-900/50 p-4 rounded-lg border border-amber-800">
                        <div class="text-sm text-amber-400 mb-1">Izjednačenje</div>
                        <div class="text-2xl font-bold text-amber-500" id="res-tie">- %</div>
                    </div>
                    <div class="bg-red-900/50 p-4 rounded-lg border border-red-800">
                        <div class="text-sm text-red-400 mb-1">Poraz</div>
                        <div class="text-2xl font-bold text-red-500" id="res-loss">- %</div>
                    </div>
                </div>

                <div id="best-cards-section" class="mt-6 border-t border-slate-700 pt-6 hidden">
                    <h3 class="text-sm text-slate-300 mb-3 font-medium text-center">Karte koje ti najviše pomažu (Top 5):</h3>
                    <div id="best-cards-slots" class="flex flex-wrap gap-3 justify-center">
                        <!-- Karte će se generirati ovdje -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Desna strana: Birač karata -->
        <div class="w-full lg:w-1/2 p-6 md:p-10 bg-slate-800 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Odaberi kartu iz špila</h2>
                <div class="text-sm">
                    Trenutno biraš za: <span id="selection-mode-label" class="font-bold text-blue-400">Tvoje karte</span>
                </div>
            </div>
            
            <div class="flex-1 flex flex-col justify-between gap-4" id="deck-container">
                <!-- Redovi karata će biti generirani JavaScriptom -->
            </div>
        </div>
    </div>

    <!-- SCRIPT SEKCIJA -->
    <script>
        const SUITS = [
            { id: 's', symbol: '♠', colorClass: 'suit-spades' },
            { id: 'h', symbol: '♥', colorClass: 'suit-hearts' },
            { id: 'c', symbol: '♣', colorClass: 'suit-clubs' },
            { id: 'd', symbol: '♦', colorClass: 'suit-diams' }
        ];
        // Ranks: index predstavlja snagu (2=2, J=11, A=14)
        const RANKS = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
        
        // Stanje aplikacije
        let heroCards = []; // Max 2
        let boardCards = []; // Max 5
        let deck = []; // Sve karte
        let selectionMode = 'hero'; // 'hero' ili 'board'

        // Generiraj špil od 52 karte
        function generateDeck() {
            let newDeck = [];
            for (let suit of SUITS) {
                for (let i = 0; i < RANKS.length; i++) {
                    newDeck.push({
                        id: `${RANKS[i]}${suit.id}`, // npr. 'Ah' (As herc)
                        rankLabel: RANKS[i],
                        rankValue: i + 2, // 2 je 2, As je 14
                        suit: suit
                    });
                }
            }
            return newDeck;
        }

        function renderUI() {
            // Iscrtaj Tvoje karte (2 slota)
            const heroContainer = document.getElementById('hero-slots');
            heroContainer.innerHTML = '';
            for (let i = 0; i < 2; i++) {
                if (heroCards[i]) {
                    heroContainer.appendChild(createCardElement(heroCards[i], () => removeCard('hero', i)));
                } else {
                    let emptySlot = document.createElement('div');
                    emptySlot.className = `slot ${selectionMode === 'hero' ? 'border-blue-500 bg-blue-900/20' : ''}`;
                    emptySlot.innerHTML = `<span class="text-slate-600 font-bold">Karta ${i+1}</span>`;
                    heroContainer.appendChild(emptySlot);
                }
            }

            // Iscrtaj Karte na stolu (5 slotova)
            const boardContainer = document.getElementById('board-slots');
            boardContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                if (boardCards[i]) {
                    boardContainer.appendChild(createCardElement(boardCards[i], () => removeCard('board', i)));
                } else {
                    let emptySlot = document.createElement('div');
                    emptySlot.className = `slot ${selectionMode === 'board' ? 'border-blue-500 bg-blue-900/20' : ''}`;
                    let label = i < 3 ? 'Flop' : (i === 3 ? 'Turn' : 'River');
                    emptySlot.innerHTML = `<span class="text-slate-600 font-bold text-xs">${label}</span>`;
                    boardContainer.appendChild(emptySlot);
                }
            }

            // Ažuriraj labelu moda biranja
            if (heroCards.length < 2) selectionMode = 'hero';
            else selectionMode = 'board';
            
            document.getElementById('selection-mode-label').innerText = selectionMode === 'hero' ? 'Tvoje karte' : 'Stol (Community)';
            document.getElementById('selection-mode-label').className = selectionMode === 'hero' ? 'font-bold text-blue-400' : 'font-bold text-amber-400';

            // Iscrtaj Špil (samo jednom, kasnije samo ažuriramo klase)
            renderDeck();
        }

        function createCardElement(cardObj, onClickHandler) {
            const div = document.createElement('div');
            div.className = 'card bg-white rounded-lg shadow-md w-full h-full min-h-[120px] flex flex-col justify-between p-2 relative';
            div.onclick = onClickHandler;
            
            const isRed = cardObj.suit.id === 'h' || cardObj.suit.id === 'd';
            const colorClass = isRed ? 'text-red-500' : 'text-slate-800';
            
            let displayRank = cardObj.rankLabel === 'T' ? '10' : cardObj.rankLabel;

            div.innerHTML = `
                <div class="text-lg font-bold leading-none ${colorClass}">${displayRank}</div>
                <div class="text-3xl text-center flex-1 flex items-center justify-center ${colorClass}">${cardObj.suit.symbol}</div>
                <div class="text-lg font-bold leading-none ${colorClass} rotate-180">${displayRank}</div>
            `;
            return div;
        }

        function renderDeck() {
            const container = document.getElementById('deck-container');
            container.innerHTML = '';
            
            // Grupiraj po boji (suit)
            SUITS.forEach(suit => {
                const row = document.createElement('div');
                row.className = 'flex gap-1 justify-between';
                
                RANKS.forEach(rankLabel => {
                    const cardId = `${rankLabel}${suit.id}`;
                    const cardObj = deck.find(c => c.id === cardId);
                    
                    const isSelected = heroCards.some(c => c.id === cardId) || boardCards.some(c => c.id === cardId);
                    
                    const cardDiv = document.createElement('div');
                    cardDiv.className = `bg-white rounded shadow-sm w-8 h-12 flex flex-col items-center justify-center text-xs font-bold card cursor-pointer hover:bg-slate-100 ${isSelected ? 'disabled' : ''}`;
                    if(!isSelected) cardDiv.onclick = () => selectCard(cardObj);
                    
                    const colorClass = (suit.id === 'h' || suit.id === 'd') ? 'text-red-500' : 'text-slate-800';
                    let displayRank = rankLabel === 'T' ? '10' : rankLabel;
                    
                    cardDiv.innerHTML = `<span class="${colorClass}">${displayRank}</span><span class="${colorClass}">${suit.symbol}</span>`;
                    row.appendChild(cardDiv);
                });
                container.appendChild(row);
            });
        }

        function selectCard(cardObj) {
            if (selectionMode === 'hero' && heroCards.length < 2) {
                heroCards.push(cardObj);
            } else if (selectionMode === 'board' && boardCards.length < 5) {
                boardCards.push(cardObj);
            }
            renderUI();
        }

        function removeCard(type, index) {
            if (type === 'hero') heroCards.splice(index, 1);
            if (type === 'board') boardCards.splice(index, 1);
            
            // Resetiraj rezultate kad se promijene karte
            document.getElementById('res-win').innerText = '- %';
            document.getElementById('res-tie').innerText = '- %';
            document.getElementById('res-loss').innerText = '- %';
            document.getElementById('best-cards-section').classList.add('hidden'); // Skrij top karte
            
            renderUI();
        }

        function resetApp() {
            heroCards = [];
            boardCards = [];
            document.getElementById('res-win').innerText = '- %';
            document.getElementById('res-tie').innerText = '- %';
            document.getElementById('res-loss').innerText = '- %';
            document.getElementById('best-cards-section').classList.add('hidden'); // Skrij top karte
            renderUI();
        }

        // Brzi evaluator 5 karata. Vraća broj: veći broj = jača ruka.
        // Format rezultata: HandRank(0-8) + Karte rangirane po bitnosti (kako bi se razbila izjednačenja)
        function evaluate5Cards(cards) {
            // Sortiraj padajuće po snazi (rankValue)
            cards.sort((a, b) => b.rankValue - a.rankValue);

            const isFlush = cards[0].suit.id === cards[1].suit.id && 
                            cards[1].suit.id === cards[2].suit.id && 
                            cards[2].suit.id === cards[3].suit.id && 
                            cards[3].suit.id === cards[4].suit.id;
                            
            let isStraight = false;

            if (cards[0].rankValue - cards[4].rankValue === 4 && new Set(cards.map(c=>c.rankValue)).size === 5) {
                isStraight = true; // Obična skala (npr. 9 8 7 6 5)
            } else if (cards[0].rankValue === 14 && cards[1].rankValue === 5 && cards[2].rankValue === 4 && cards[3].rankValue === 3 && cards[4].rankValue === 2) {
                isStraight = true; // As-low skala (A 2 3 4 5)
                // Pomakni As na kraj za ispravno bodovanje pri izjednačenju (najjača karta je 5, a ne As)
                cards = [cards[1], cards[2], cards[3], cards[4], cards[0]];
            }

            let counts = {};
            cards.forEach(c => counts[c.rankValue] = (counts[c.rankValue] || 0) + 1);
            let freqs = Object.values(counts).sort((a, b) => b - a);
            
            let handType = 0; // High card
            if (isStraight && isFlush) handType = 8; // Straight Flush
            else if (freqs[0] === 4) handType = 7; // Quads
            else if (freqs[0] === 3 && freqs[1] === 2) handType = 6; // Full House
            else if (isFlush) handType = 5; // Flush
            else if (isStraight) handType = 4; // Straight
            else if (freqs[0] === 3) handType = 3; // Trips
            else if (freqs[0] === 2 && freqs[1] === 2) handType = 2; // Two Pair
            else if (freqs[0] === 2) handType = 1; // Pair

            // Za izjednačenja, moramo sortirati jedinstvene rangove prema frekvenciji, pa po snazi
            let uniqueRanks = Object.keys(counts).map(Number).sort((a, b) => {
                if (counts[b] !== counts[a]) return counts[b] - counts[a];
                return b - a; // Ako je frekvencija ista, jača karta ide prva
            });

            // Generiranje jedinstvenog skora (Max ~89999999999)
            let score = handType * 10000000000;
            let multiplier = 10000000;
            for (let i = 0; i < uniqueRanks.length; i++) {
                for(let j=0; j<counts[uniqueRanks[i]]; j++) {
                    // Dodajemo vrijednost svake karte na točnu decimalnu poziciju
                    score += uniqueRanks[i] * multiplier;
                    multiplier /= 100;
                }
            }
            return score;
        }

        // Evaluator za 7 karata (pronalazi najboljih 5 karata)
        function evaluate7Cards(sevenCards) {
            let bestScore = 0;
            // Svih 21 kombinacija od 5 karata iz 7
            const combos = [
                [0,1,2,3,4], [0,1,2,3,5], [0,1,2,3,6], [0,1,2,4,5], [0,1,2,4,6],
                [0,1,2,5,6], [0,1,3,4,5], [0,1,3,4,6], [0,1,3,5,6], [0,1,4,5,6],
                [0,2,3,4,5], [0,2,3,4,6], [0,2,3,5,6], [0,2,4,5,6], [0,3,4,5,6],
                [1,2,3,4,5], [1,2,3,4,6], [1,2,3,5,6], [1,2,4,5,6], [1,3,4,5,6],
                [2,3,4,5,6]
            ];
            
            for (let i = 0; i < combos.length; i++) {
                let fiveCardCombo = [
                    sevenCards[combos[i][0]], sevenCards[combos[i][1]], sevenCards[combos[i][2]],
                    sevenCards[combos[i][3]], sevenCards[combos[i][4]]
                ];
                let score = evaluate5Cards(fiveCardCombo);
                if (score > bestScore) bestScore = score;
            }
            return bestScore;
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Glavna funkcija koja provodi Monte Carlo simulaciju
        function runSimulation() {
            if (heroCards.length !== 2) {
                alert("Morate odabrati točno 2 karte za sebe!");
                resetUIState();
                return;
            }

            const ITERATIONS = 5000; // Povećan broj simulacija za veću preciznost
            const NUM_OPPONENTS = 8; // 9 max turnir = 1 hero + 8 opponents
            
            let wins = 0;
            let ties = 0;
            let losses = 0;

            // Odredi koje su karte još u špilu
            let usedIds = [...heroCards, ...boardCards].map(c => c.id);
            let remainingDeck = deck.filter(c => !usedIds.includes(c.id));

            for (let i = 0; i < ITERATIONS; i++) {
                // Za svaku iteraciju napravi novu "kopiju" preostalog špila i promiješaj
                let tempDeck = shuffle([...remainingDeck]);
                let tempBoard = [...boardCards];
                
                // Podijeli preostale karte za stol dok ne bude 5
                let cardsNeededForBoard = 5 - tempBoard.length;
                for (let j = 0; j < cardsNeededForBoard; j++) {
                    tempBoard.push(tempDeck.pop());
                }

                // Evaluacija Herojeve ruke (7 karata)
                let heroScore = evaluate7Cards([...heroCards, ...tempBoard]);
                
                // Podijeli karte za 8 protivnika i provjeri pobjeđuje li Hero
                let heroWins = true;
                let isTie = false;

                for (let opp = 0; opp < NUM_OPPONENTS; opp++) {
                    let oppCard1 = tempDeck.pop();
                    let oppCard2 = tempDeck.pop();
                    
                    let oppScore = evaluate7Cards([oppCard1, oppCard2, ...tempBoard]);
                    
                    if (oppScore > heroScore) {
                        heroWins = false;
                        isTie = false;
                        break; // Netko nas je pobijedio, ne moramo dalje provjeravati ostale za ovu iteraciju
                    } else if (oppScore === heroScore) {
                        heroWins = false;
                        isTie = true; // Izjednačenje (split pot), ali moramo provjeriti hoće li nas netko idući pobijediti
                    }
                }

                if (heroWins) wins++;
                else if (isTie) ties++;
                else losses++;
            }

            // Izračun postotaka
            const winPct = ((wins / ITERATIONS) * 100).toFixed(1);
            const tiePct = ((ties / ITERATIONS) * 100).toFixed(1);
            const lossPct = ((losses / ITERATIONS) * 100).toFixed(1);

            // Ažuriranje UI
            document.getElementById('res-win').innerText = `${winPct} %`;
            document.getElementById('res-tie').innerText = `${tiePct} %`;
            document.getElementById('res-loss').innerText = `${lossPct} %`;
            
            // Pokreni analizu sljedećih karata ako još nismo na Riveru (5 karata)
            if (boardCards.length < 5) {
                analyzeNextCards(remainingDeck);
            } else {
                document.getElementById('best-cards-section').classList.add('hidden');
            }
            
            resetUIState();
        }

        function calculateOdds() {
            if(heroCards.length !== 2) return;
            
            // Prikaži loader i promijeni tekst
            document.getElementById('calc-text').innerText = 'Računam...';
            document.getElementById('calc-loader').classList.remove('hidden');
            document.getElementById('calc-btn').classList.add('opacity-80', 'cursor-not-allowed');
            
            // Koristimo setTimeout kako bismo dali pregledniku milisekundu da osvježi UI (prikaže loader)
            // prije nego što sinkrona Monte Carlo funkcija "zaledi" main thread.
            setTimeout(() => {
                runSimulation();
            }, 50);
        }

        function resetUIState() {
            document.getElementById('calc-text').innerText = 'Izračunaj Šanse';
            document.getElementById('calc-loader').classList.add('hidden');
            document.getElementById('calc-btn').classList.remove('opacity-80', 'cursor-not-allowed');
        }

        // NOVO: Funkcija koja analizira koje bi karte sljedeće bile najbolje
        function analyzeNextCards(remainingDeck) {
            const MINI_ITERATIONS = 150; // Manji broj simulacija po karti da ne opteretimo preglednik
            const NUM_OPPONENTS = 8;
            let cardScores = [];

            // Prođi kroz svaku preostalu kartu u špilu
            for (let i = 0; i < remainingDeck.length; i++) {
                let testCard = remainingDeck[i];
                let tempBoard = [...boardCards, testCard]; // Zamislimo da je ova karta pala na stol
                let deckWithoutTest = remainingDeck.filter(c => c.id !== testCard.id);
                
                let wins = 0;

                // Odvrti mini-simulaciju za tu specifičnu kartu
                for (let j = 0; j < MINI_ITERATIONS; j++) {
                    let tempDeck = shuffle([...deckWithoutTest]);
                    let finalBoard = [...tempBoard];
                    
                    // Nadopuni board do 5 karata (za River)
                    let cardsNeededForBoard = 5 - finalBoard.length;
                    for (let k = 0; k < cardsNeededForBoard; k++) {
                        finalBoard.push(tempDeck.pop());
                    }

                    let heroScore = evaluate7Cards([...heroCards, ...finalBoard]);
                    let heroWins = true;

                    // Provjeri protivnike
                    for (let opp = 0; opp < NUM_OPPONENTS; opp++) {
                        let oppScore = evaluate7Cards([tempDeck.pop(), tempDeck.pop(), ...finalBoard]);
                        if (oppScore >= heroScore) { // Računamo samo čiste pobjede
                            heroWins = false;
                            break;
                        }
                    }
                    if (heroWins) wins++;
                }
                
                // Spremi kartu i njen "skor pobjeda"
                cardScores.push({ card: testCard, winPct: (wins / MINI_ITERATIONS) });
            }

            // Sortiraj padajuće - od najbolje karte do najgore
            cardScores.sort((a, b) => b.winPct - a.winPct);
            
            // Izdvoji Top 5 i pošalji ih na crtanje u UI
            renderBestCards(cardScores.slice(0, 5));
        }

        // NOVO: Prikaz top 5 karata u korisničkom sučelju
        function renderBestCards(topCards) {
            const section = document.getElementById('best-cards-section');
            const container = document.getElementById('best-cards-slots');
            container.innerHTML = ''; // Očisti prijašnje karte
            
            topCards.forEach(item => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'bg-white rounded shadow-md w-12 h-16 flex flex-col items-center justify-center text-base font-bold border border-slate-300 transform transition hover:scale-110';
                
                const isRed = item.card.suit.id === 'h' || item.card.suit.id === 'd';
                const colorClass = isRed ? 'text-red-500' : 'text-slate-800';
                let displayRank = item.card.rankLabel === 'T' ? '10' : item.card.rankLabel;
                
                cardDiv.innerHTML = `
                    <span class="${colorClass} leading-none">${displayRank}</span>
                    <span class="${colorClass} leading-none text-xl">${item.card.suit.symbol}</span>
                `;
                container.appendChild(cardDiv);
            });
            
            // Pokaži sekciju
            section.classList.remove('hidden');
        }

        // Pokreni aplikaciju
        deck = generateDeck();
        renderUI();
    </script>
</body>
</html>
